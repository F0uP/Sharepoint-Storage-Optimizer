name: Desktop

# Builds the Windows installer (.exe) and macOS disk images (.dmg, Apple Silicon + Intel).
# A pushed tag v1.2.3 publishes them as a GitHub Release; manual runs and pull requests that
# touch the desktop shell keep them as artifacts.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "e2e-desktop/**"
      - "scripts/build-desktop.mjs"
      - "scripts/desktop-smoke.mjs"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (.exe)
            os: windows-latest
            target: --win nsis --x64
            executable: dist-desktop/release/win-unpacked/SharePoint Storage Optimizer.exe
          - name: macOS (.dmg)
            os: macos-latest
            target: --mac dmg --arm64 --x64
            executable: dist-desktop/release/mac-arm64/SharePoint Storage Optimizer.app/Contents/MacOS/SharePoint Storage Optimizer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Take version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build web app and stage desktop app
        run: npm run desktop:build

      - name: Unit tests of the desktop modules (incl. ffmpeg compression where available)
        run: npx vitest run desktop

      - name: Desktop end-to-end tests
        if: runner.os == 'Windows'
        run: npm run test:desktop

      - name: Package
        run: npx electron-builder --config desktop/electron-builder.mjs ${{ matrix.target }} --publish never
        env:
          # All optional – without them Windows builds are unsigned and macOS builds are signed ad hoc.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}

      - name: Smoke test the packaged app
        run: node scripts/desktop-smoke.mjs "${{ matrix.executable }}"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          # installers plus the update feed (latest*.yml, blockmaps, macOS zip) for the in-app updater
          path: |
            dist-desktop/release/*.exe
            dist-desktop/release/*.dmg
            dist-desktop/release/*.zip
            dist-desktop/release/*.blockmap
            dist-desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
