<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:" />
    <title>SharePoint Storage Optimizer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #171717;
        --muted: #737373;
        --track: #e5e5e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a3a3a3;
          --track: #262626;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        user-select: none;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 18px;
      }
      .bar {
        width: 120px;
        height: 2px;
        border-radius: 2px;
        background: var(--track);
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: var(--fg);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      p {
        margin: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#171717" />
        <rect x="7" y="9" width="18" height="3.4" rx="1.7" fill="#fff" />
        <rect x="7" y="14.3" width="12.8" height="3.4" rx="1.7" fill="#fff" opacity=".75" />
        <rect x="7" y="19.6" width="7.5" height="3.4" rx="1.7" fill="#fff" opacity=".5" />
      </svg>
      <div class="bar"></div>
      <p>Wird gestartet …</p>
    </main>
  </body>
</html>
